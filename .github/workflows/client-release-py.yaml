name: Python Client Release

on:
  push:
    tags:
      - 'sdk-py/v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/client/acontext-py
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "latest"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/sdk-py/v}
          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        run: |
          bash .github/scripts/generate-changelog.sh \
            --tag-prefix "sdk-py/v" \
            --source-dir "src/client/acontext-py" \
            --display-name "Python SDK" \
            --output "${{ github.workspace }}-CHANGELOG.txt" \
            --footer "Published to https://pypi.org/project/acontext/${{ steps.version.outputs.version }}/"

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
